services:
  - type: web
    name: library-management
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed.py && gunicorn wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"

databases:
  - name: library-db
    plan: free
